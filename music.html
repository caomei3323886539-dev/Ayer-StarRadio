<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dceeff">
<meta name="description" content="艾耶尔大陆·星音音乐：原创音乐、专辑、歌单、实时歌词与私人音乐库。">
<title>星音音乐 · 艾耶尔大陆在线音乐平台</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./music.css?v=093">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="音乐导航">
    <a class="brand" href="./music.html"><span class="brand-icon">✦</span><span>星音音乐<small>AYER STAR MUSIC</small></span></a>
    <p class="nav-caption">音乐馆</p>
    <nav class="side-nav">
      <button type="button" data-view="home" class="active"><span>⌂</span> 推荐首页</button>
      <button type="button" data-view="discover"><span>♫</span> 发现音乐</button>
      <button type="button" data-view="albums"><span>▣</span> 专辑合集</button>
      <button type="button" data-view="artists"><span>✧</span> 歌手与创作者</button>
    </nav>
    <p class="nav-caption">我的音乐</p>
    <nav class="side-nav"><button type="button" data-view="profile"><span>◉</span> 个人音乐中心</button></nav>
    <nav class="side-nav">
      <button type="button" data-view="favorites"><span>♡</span> 我喜欢的音乐</button>
      <button type="button" data-view="recent"><span>◷</span> 最近播放</button>
      <button type="button" data-view="playlists"><span>☷</span> 我的歌单</button>
      <button type="button" data-view="private"><span>♬</span> 私人云音乐库</button>
    </nav>
    <div class="side-links">
      <a href="./cloud.html">云端音乐管理 <span aria-hidden="true">↗</span></a>
      <a href="./index.html">离线音乐播放器 <span aria-hidden="true">↗</span></a>
      <a href="./public.html">经典公开音乐馆 <span aria-hidden="true">↗</span></a>
    </div>
    <p class="copyright">© 艾耶尔大陆 · 原创音乐馆</p>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button type="button" class="icon-btn mobile-menu" id="mobileMenu" aria-label="打开菜单">☰</button>
      <a class="mobile-brand" href="./music.html">✦ 星音音乐</a>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><label class="sr-only" for="searchInput">搜索歌曲、歌手或专辑</label><input id="searchInput" autocomplete="off" placeholder="搜索歌曲、歌手、专辑…"><kbd>⌕</kbd></div>
      <div class="account-actions">
        <span class="connection" id="connection">公开模式</span>
        <button type="button" id="accountBtn" class="pill accent">登录 / 注册</button>
      </div>
    </header>

    <main class="content" id="mainContent" tabindex="-1">
      <div class="announcement" id="notice" role="status" aria-live="polite">正在连接星音音乐馆…</div>
      <div id="viewRoot"></div>
    </main>
  </div>
</div>

<nav class="mobile-nav" aria-label="手机快捷导航">
  <button type="button" data-view="home" class="active"><span>⌂</span>首页</button>
  <button type="button" data-view="discover"><span>♫</span>发现</button>
  <button type="button" data-view="favorites"><span>♡</span>喜欢</button>
  <button type="button" data-view="playlists"><span>☷</span>歌单</button>
  <button type="button" data-view="profile"><span>◉</span>我的</button>
</nav>

<div class="player" id="player">
  <div class="player-song" id="openPlayer" role="button" tabindex="0" aria-label="打开完整播放器详情" title="打开播放器详情">
    <div class="disc-wrap"><div class="vinyl" id="vinyl"><div class="vinyl-label" id="playerArt">✦</div></div></div>
    <div class="player-meta"><strong id="nowTitle">等待播放</strong><span id="nowArtist">在音乐馆选择一首歌曲</span></div>
    <button type="button" id="likeNow" class="icon-btn now-like" title="收藏当前歌曲" aria-label="收藏当前歌曲">♡</button>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button type="button" id="shuffleBtn" class="icon-btn minor" title="随机播放" aria-label="随机播放">⤨</button>
      <button type="button" id="prevBtn" class="icon-btn" title="上一首" aria-label="上一首">⏮</button>
      <button type="button" id="playBtn" class="play-main" title="播放或暂停" aria-label="播放或暂停">▶</button>
      <button type="button" id="nextBtn" class="icon-btn" title="下一首" aria-label="下一首">⏭</button>
      <button type="button" id="repeatBtn" class="icon-btn minor" title="顺序循环/单曲循环" aria-label="切换循环模式">↻</button>
    </div>
    <div class="timeline"><span id="timeNow">0:00</span><label class="sr-only" for="seekBar">播放进度</label><input id="seekBar" type="range" value="0" min="0" max="100" step="0.1"><span id="timeTotal">0:00</span></div>
  </div>
  <div class="player-extra">
    <button type="button" id="lyricsBtn" class="icon-btn" title="打开实时歌词" aria-label="打开实时歌词">词</button>
    <button type="button" id="queueBtn" class="icon-btn" title="打开播放队列" aria-label="打开播放队列">☷</button>
    <span class="volume-icon" aria-hidden="true">◖))</span>
    <label class="sr-only" for="volume">音量</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.75">
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<aside class="drawer" id="queueDrawer" aria-label="播放队列" hidden>
  <div class="drawer-header"><div><small>播放中的音乐</small><h2>播放队列 <span id="queueCount"></span></h2></div><button type="button" id="closeQueue" class="icon-btn" aria-label="关闭播放队列">✕</button></div>
  <div id="queueItems"></div>
</aside>

<section id="lyricsDialog" class="lyric-dialog player-detail" role="dialog" aria-modal="true" aria-label="完整播放器详情" aria-hidden="true" hidden>
  <div class="dialog-head"><button type="button" id="closeLyrics" class="icon-btn" aria-label="收起播放器">⌄</button><div class="detail-heading"><small>AYER STAR MUSIC · NOW PLAYING</small><h2 id="lyricHeading">正在播放</h2></div><button type="button" id="detailQueueBtn" class="icon-btn" aria-label="打开播放队列">☷</button></div>
  <div class="detail-backdrop-art" id="detailBackdrop" aria-hidden="true"></div>
  <div class="detail-view-toggle" role="group" aria-label="播放器显示模式"><button type="button" id="showDisc" class="active" aria-pressed="true">黑胶唱片</button><button type="button" id="showLyrics" aria-pressed="false">实时歌词</button></div>
  <div class="lyric-layout" id="detailLayout"><div class="lyric-art"><div class="turntable-stage"><div class="lyric-disc vinyl" id="lyricDisc"><div class="vinyl-label" id="lyricArt">✦</div></div><svg class="tonearm" id="tonearm" viewBox="0 0 220 300" aria-hidden="true" focusable="false"><defs><linearGradient id="armMetal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#c6d6e5"/><stop offset="1" stop-color="#829db4"/></linearGradient></defs><circle cx="184" cy="29" r="19" fill="#7995aa" opacity=".22"/><circle cx="184" cy="29" r="12" fill="url(#armMetal)" stroke="#7d9bad" stroke-width="3"/><g class="tonearm-moving"><path d="M184 29 L151 100 L113 186 L58 267" fill="none" stroke="#8195a7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M184 29 L151 100 L113 186 L58 267" fill="none" stroke="url(#armMetal)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="260" width="31" height="18" rx="5" fill="#eef5fb" stroke="#809caf" stroke-width="3" transform="rotate(-20 52 269)"/><path d="M42 269h18" stroke="#829bb1" stroke-width="2"/></g><circle cx="184" cy="29" r="5" fill="#f7fbff"/></svg></div><h3 id="lyricArtist">星音音乐</h3></div><div id="lyricLines" class="lyric-lines"></div></div>
  <div class="detail-controls"><div class="detail-timeline"><span id="detailTimeNow">0:00</span><input id="detailSeek" aria-label="播放器详情进度" type="range" min="0" max="100" step="0.1" value="0"><span id="detailTimeTotal">0:00</span></div><div class="detail-buttons"><button type="button" id="detailShuffle" class="icon-btn" aria-label="随机播放">⤨</button><button type="button" id="detailPrev" class="icon-btn" aria-label="上一首">⏮</button><button type="button" id="detailPlay" class="play-main" aria-label="播放或暂停">▶</button><button type="button" id="detailNext" class="icon-btn" aria-label="下一首">⏭</button><button type="button" id="detailRepeat" class="icon-btn" aria-label="切换循环">↻</button></div></div>
</section>

<dialog id="authDialog" class="simple-dialog">
  <div class="dialog-head"><div><small>AYER STAR MUSIC</small><h2>星音账号</h2></div><button type="button" class="icon-btn" id="closeAuth" aria-label="关闭登录">✕</button></div>
  <div id="signedIn" hidden><p id="signedInEmail"></p><button type="button" id="signOut" class="full">退出当前账号</button></div>
  <form id="authForm">
    <label for="email">邮箱</label><input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
    <label for="password">密码</label><input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="输入密码">
    <div class="auth-buttons"><button type="submit" class="accent" id="signIn">登录</button><button type="button" id="signUp">注册账号</button></div>
    <p class="hint">游客可免费浏览已发布音乐。登录后启用收藏、个人歌单与私人音乐库。</p>
  </form>
</dialog>

<dialog id="playlistDialog" class="simple-dialog">
  <div class="dialog-head"><h2>创建我的歌单</h2><button type="button" id="closePlaylist" class="icon-btn" aria-label="关闭">✕</button></div>
  <form id="playlistForm"><label for="playlistName">歌单名称</label><input id="playlistName" maxlength="100" required placeholder="例如：神之谷 OST 精选"><button type="submit" class="accent full">创建歌单</button></form>
</dialog>

<dialog id="addDialog" class="simple-dialog">
  <div class="dialog-head"><h2>加入歌单</h2><button type="button" id="closeAdd" class="icon-btn" aria-label="关闭">✕</button></div>
  <p class="hint">仅已公开发布的歌曲可以添加到在线歌单。</p><div id="addTarget"></div>
</dialog>

<div class="backdrop" id="backdrop" hidden></div>
<script type="module" src="./music.js?v=093"></script>
</body>
</html>
