name: Validate Star Music
on:
  push:
    paths:
      - 'music.html'
      - 'alpha2-preview.html'
      - 'tests/alpha2-preview.test.cjs'
      - 'tests/alpha2-artwork.test.cjs'
      - 'docs/alpha2-approved-art.json'
      - 'music.css'
      - 'ui/**'
      - 'assets/navigation/**'
      - 'assets/ornaments/**'
      - 'music.js'
      - 'local-library.js'
      - 'assets/ayer_home_harpist.webp'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/music.test.cjs'
      - 'tests/local-library.test.cjs'
      - '.github/workflows/validate-music.yml'
  pull_request:
    paths:
      - 'music.html'
      - 'alpha2-preview.html'
      - 'tests/alpha2-preview.test.cjs'
      - 'tests/alpha2-artwork.test.cjs'
      - 'docs/alpha2-approved-art.json'
      - 'music.css'
      - 'ui/**'
      - 'assets/navigation/**'
      - 'assets/ornaments/**'
      - 'music.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/music.test.cjs'
      - '.github/workflows/validate-music.yml'
permissions:
  contents: read
jobs:
  music-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/music.test.cjs tests/local-library.test.cjs tests/alpha2-preview.test.cjs tests/alpha2-artwork.test.cjs
      - name: Package full Alpha 2 test site
        if: github.ref == 'refs/heads/ui/v1.0.0-alpha2'
        run: git archive --format=zip --output=Ayer_Alpha2_Test_Site.zip HEAD
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/ui/v1.0.0-alpha2'
        with:
          name: Ayer_Alpha2_Test_Site
          path: Ayer_Alpha2_Test_Site.zip
